<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App desde CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div>
        <div class="flex items-center justify-center h-screen bg-gray-100">
            <div class="bg-white p-8 rounded shadow-md">
                <h2 class="text-2xl mb-6">Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                        <input type="email" id="email" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md" />
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                        <input type="password" id="password" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md" />
                    </div>
                    <p id="error-message" class="hidden text-red-500">Credenciales incorrectas.</p>
                    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Iniciar Sesión</button>
                    <div id="error-message" class="text-red-500 mt-4 hidden"></div>
                </form>
            </div>
        </div>
    </div>    
</body>
</html>
